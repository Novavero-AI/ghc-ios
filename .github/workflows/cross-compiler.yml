name: Build GHC Cross Compiler (iOS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish the toolchain as this Release tag (e.g. v45). Empty = artifact only.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: cross-compiler
  cancel-in-progress: true

jobs:
  build-ghc-ios:
    name: GHC 9.14.1 -> aarch64-apple-ios
    runs-on: macos-latest
    timeout-minutes: 180

    env:
      # The iOS deployment floor, written ONCE. Every consumer below
      # derives "arm64-apple-ios${IOS_MIN}" from it: the build wrappers,
      # the LLVM triple injected into configure, the shipped wrapper, the
      # settings normalisation, and every assertion. GHC has no concept
      # of an Apple deployment target, so this value is the whole of our
      # convention for one - spelling it nine times as a literal is how
      # a floor bump silently half-lands. nova-kit mirrors the same floor
      # in its ci.yml IOS_MIN and its nova-kit.toml ios.min-version.
      IOS_MIN: '15.0'

    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment):
      # major tags are movable, and the publish job below holds this
      # repo's only write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore cross GHC cache
        id: cache-ghc
        # Validation runs restore the cache; a release_tag dispatch never
        # restores, so every Release is built from scratch by its own run
        # and the patch/source assertions always execute for it. The key
        # is a pure function of the build inputs (patches + this workflow,
        # which pins the source checksum and every flag), so it never
        # needs a manual bump. No restore-keys on purpose: a stale
        # toolchain must never match.
        if: ${{ inputs.release_tag == '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ghc-ios
          key: ghc-9.14.1-aarch64-apple-ios-${{ hashFiles('cross-compiler/patches/*.patch', '.github/workflows/cross-compiler.yml') }}

      - name: Install boot GHC
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          # 9.14.1's configure accepts a boot GHC as old as 9.6, but the
          # only versions hadrian ships bootstrap plans for are 9.10.x and
          # 9.12.x, and under hadrian/cabal.project's pinned index-state
          # (2025-01-27) a 9.10 boot compiler forces cabal to rebuild
          # directory, process, file-io and Cabal from Hackage. 9.12.2
          # needs none of them.
          ghc-version: '9.12.2'
          cabal-version: 'latest'

      - name: Install build deps
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          brew install automake autoconf libtool
          # Exact versions: a floating 'cabal install alex happy' takes
          # whatever is newest, and can land in the window where a mirror
          # has not yet synced a fresh release. happy is pinned to 2.1.7,
          # not 2.2: configure.ac's check is `>= 2.0.2 && < 2.2`, and
          # while a release tarball ships pre-generated parsers (so the
          # check never runs), an in-bounds version is the honest pin.
          cd /tmp && cabal install alex-3.5.4.2 happy-2.1.7 --install-method=copy --overwrite-policy=always
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      - name: Assert boot toolchain
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          # configure resolves its boot compiler through WithGhc, but
          # hadrian/build-cabal independently takes GHC="${GHC:-ghc}" off
          # PATH. If those two ever disagree the build configures against
          # one stage0 and compiles against another, so pin the
          # expectation here rather than discovering it mid-build.
          test "$(ghc --numeric-version)" = "9.12.2" \
            || { echo "boot GHC is $(ghc --numeric-version), expected 9.12.2"; exit 1; }

      - name: Download and extract GHC source
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          curl -L https://downloads.haskell.org/ghc/9.14.1/ghc-9.14.1-src.tar.xz -o /tmp/ghc-src.tar.xz
          # Pin the source input like everything else (alex/happy versions,
          # action SHAs): the value from the official 9.14.1 SHA256SUMS.
          echo "2a83779c9af86554a3289f2787a38d6aa83d00d136aa9f920361dd693c101e77  /tmp/ghc-src.tar.xz" | shasum -a 256 -c -
          tar xf /tmp/ghc-src.tar.xz -C /tmp
          rm /tmp/ghc-src.tar.xz

      - name: Create cross-compiler wrappers
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $IOS_SDK"

          # Apple's clang, via xcrun. Through GHC 9.8 this build used
          # Homebrew LLVM because Apple's integrated assembler rejected
          # libffi 3.4.6's aarch64 CFI; libffi 3.5.2 (vendored by 9.14)
          # fixed the construct that actually tripped it, and both
          # assemblers now build it clean. Using Apple clang here also
          # makes the build compiler the same one the SHIPPED ios-cc
          # wrapper invokes at runtime, which was never true before.
          IOS_CC=$(xcrun --sdk iphoneos -f clang)
          IOS_CXX=$(xcrun --sdk iphoneos -f clang++)
          IOS_TRIPLE="arm64-apple-ios${IOS_MIN}"

          printf '#!/bin/bash\nexec %s -target %s -isysroot %s "$@"\n' "$IOS_CC" "$IOS_TRIPLE" "$IOS_SDK" > /tmp/ios-cc
          printf '#!/bin/bash\nexec %s -target %s -isysroot %s "$@"\n' "$IOS_CXX" "$IOS_TRIPLE" "$IOS_SDK" > /tmp/ios-cxx
          chmod +x /tmp/ios-cc /tmp/ios-cxx

          # Verify wrappers work
          /tmp/ios-cc --version
          /tmp/ios-cxx --version

      - name: Apply iOS patches
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          cd /tmp/ghc-9.14.1

          # Apply unified diff patches from cross-compiler/patches/.
          #   003 - RTS: guard mach_vm.h includes for iOS
          #   005 - process: guard both posix_spawn addchdir variants for iOS
          # Numbers are historical and deliberately not renumbered: the
          # iteration log cross-references them by number throughout.
          # 001/002/004 were retired by the 9.14 port - see Phase 9.
          # --fuzz=0 because plain 'patch -p1' defaults to fuzz 2 and can
          # silently accept a fuzzy-but-wrong match; the patches are exact
          # diffs against the pinned pristine tarball, so ANY context
          # drift is a real change that must fail here, loudly.
          for p in $GITHUB_WORKSPACE/cross-compiler/patches/*.patch; do
            echo "=== Applying $(basename $p) ==="
            patch -p1 --fuzz=0 < "$p"
          done

          # Belt and braces on top of --fuzz=0: these greps assert the
          # patched code is really in place. Catching a problem here is
          # far cheaper than a cryptic compile failure 45 minutes into
          # the Hadrian build.
          MATCHES=$(grep -c '__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__' rts/ReportMemoryMap.c)
          if [ "$MATCHES" -ne 2 ]; then echo "PATCH 003 FAILED - expected 2 matches, got $MATCHES"; exit 1; fi
          # Both addchdir branches must be guarded, not just the _np one:
          # current iPhoneOS SDKs declare the standardized non-_np variant
          # too, and autoconf's link probe defines HAVE_* for both, so the
          # FIRST branch is the one that fires (log v39).
          MATCHES=$(grep -c 'ADDCHDIR.*__ENVIRONMENT_IPHONE' libraries/process/cbits/posix/posix_spawn.c)
          if [ "$MATCHES" -ne 2 ]; then echo "PATCH 005 FAILED - expected 2 matches, got $MATCHES"; exit 1; fi

      - name: Configure for iOS
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          cd /tmp/ghc-9.14.1
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IOS_TRIPLE="arm64-apple-ios${IOS_MIN}"

          # CONF_*_STAGE2, not STAGE1. In 9.14 the stage-1 (target)
          # toolchain is described by hadrian/cfg/default.target, which
          # configure generates from the STAGE2 variables; nothing
          # substitutes CONF_CC_OPTS_STAGE1 any more and hadrian never
          # reads it. Passing the iOS flags as STAGE1 would be accepted
          # silently and then dropped on the floor.
          #
          # These values carry ONLY the defines. The target comes from
          # bootstrap_llvm_target below, which FP_CC_SUPPORTS_TARGET
          # injects, and the sysroot comes from the /tmp/ios-cc wrapper,
          # which passes -isysroot on every invocation. Naming either one
          # here as well is what broke v45: hadrian flattens this list
          # into a single --configure-option=CFLAGS= string for the RTS's
          # build-type: Configure package, and includes the whole set
          # TWICE. -isysroot is the only two-token flag in it, so the
          # duplicated pair is the one thing that can lose its argument -
          # clang then read --target= as the sysroot and treated the
          # orphaned SDK path as a second input file.
          #
          # -Ddarwin_HOST_OS: the RTS gates its Mach code paths on this
          # macro. 9.14 generates ghcplatform.h from rts/configure's own
          # --host triple, so whether it defines ios_HOST_OS or
          # darwin_HOST_OS depends on the triple Cabal hands it; forcing
          # the define is correct either way and costs nothing.
          # -D_DARWIN_C_SOURCE exposes POSIX extensions such as
          # pthread_setname_np.
          # bootstrap_llvm_target is read by GHC_LLVM_TARGET_SET_VAR and
          # assigned by NOTHING in the source tree, so setting it here is
          # the supported way to override the computed LLVM triple - the
          # same shape as the CXX_STD_LIB_LIBS escape hatch below.
          # GHC_LLVM_TARGET builds a VERSIONLESS arm64-apple-ios, but an
          # Apple deployment target is part of the triple, not a flag.
          # Pinning it at the origin makes every consumer correct by
          # construction: default.target, the bindist configure (whose
          # FP_CC_SUPPORTS_TARGET injects --target=$LlvmTarget into the
          # SHIPPED cc/cxx/link flags), and the settings file. Without
          # it, clang takes the injected versionless triple as the last
          # -target and drops the floor to its default of iOS 7 - no
          # thread-local storage, LC_VERSION_MIN_IPHONEOS 7.0 instead of
          # LC_BUILD_VERSION. It is NOT used to look up llvm-targets in
          # any way that regresses: that table is keyed on
          # aarch64-apple-ios while this value has always been
          # arm64-apple-ios, so the lookup missed already.
          ./configure \
            --target=aarch64-apple-ios \
            --prefix=$HOME/ghc-ios \
            bootstrap_llvm_target="$IOS_TRIPLE" \
            CC=/tmp/ios-cc \
            CXX=/tmp/ios-cxx \
            LD=$(xcrun --sdk iphoneos -f ld) \
            AR=$(xcrun --sdk iphoneos -f ar) \
            RANLIB=$(xcrun --sdk iphoneos -f ranlib) \
            STRIP=$(xcrun --sdk iphoneos -f strip) \
            CONF_CC_OPTS_STAGE2="-D_DARWIN_C_SOURCE -Ddarwin_HOST_OS" \
            CONF_GCC_LINKER_OPTS_STAGE2="-L$IOS_SDK/usr/lib"

          # configure is authoritative for the target description
          # (--enable-ghc-toolchain defaults to NO in 9.14; ghc-toolchain
          # only runs as a non-fatal validation diff). Assert the flags
          # actually landed in default.target rather than trusting that
          # an unrecognized variable was honoured.
          grep -qF "$IOS_TRIPLE" hadrian/cfg/default.target \
            || { echo "CONF_CC_OPTS_STAGE2 did not reach default.target"; exit 1; }
          # And that the versioned triple reached the LLVM target field
          # specifically - that is the one that propagates into the
          # shipped flags. Failing here costs two minutes; failing on the
          # artifact costs the whole run.
          grep -qF "tgtLlvmTarget = \"$IOS_TRIPLE\"" hadrian/cfg/default.target \
            || { echo "bootstrap_llvm_target was not honoured"; grep tgtLlvmTarget hadrian/cfg/default.target; exit 1; }

      - name: Build with Hadrian
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          cd /tmp/ghc-9.14.1
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          # iOS cross-compilation flags:
          # - native bignum backend (no GMP on iOS)
          # - disable libm/libdl flags (part of libSystem on iOS)
          # - add libffi library path (Hadrian copies headers but not lib to rts/build)
          # --docs=none: the plain build does not need it (topLevelTargets has
          # no doc target), but Install does, and hadrian persists NOTHING
          # between invocations - so the two commands must agree or the
          # install re-plans with a different target set.
          hadrian/build -j -V --flavour=quick+native_bignum --docs=none \
            "stage1.*.ghc.link.opts += -optl-isysroot -optl$IOS_SDK" \
            "stage1.rts.cabal.configure.opts += --flags=-libm --flags=-libdl" \
            "stage1.rts.ghc.link.opts += -optl-L_build/stage1/libffi/build/inst/lib" \
            || {
              # -V above prints every command hadrian runs, so the failing
              # cc invocation is in the log verbatim. These dumps add the
              # inputs that produced it: the generated target description
              # and the settings the stage1 compiler actually reads.
              echo "=== hadrian/cfg/default.target ==="
              cat hadrian/cfg/default.target || true
              echo "=== generated settings (all stages) ==="
              find _build -name settings -maxdepth 4 -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;
              echo "=== rts config.log probe section ==="
              find _build -path '*rts*' -name config.log -exec sh -c 'echo "--- $1 ---"; tail -80 "$1"' _ {} \;
              exit 1
            }

      - name: Install
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        run: |
          cd /tmp/ghc-9.14.1
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          # Must pass the same flags as the build step - Hadrian doesn't
          # persist ANY settings between invocations (flavour, flags, opts).
          #
          # The install rule runs the binary-dist's OWN configure, which
          # re-detects a HOST toolchain and runs compile-and-execute
          # probes natively. Do NOT hand it the iOS cross wrappers: with
          # no explicit --host, autoconf compiles a test program and RUNS
          # it, and an arm64-ios binary cannot execute on the macOS host
          # ("cannot run C compiled programs"). Relatedly, MOVE_TO_FLAGS
          # requires CC to be a single path with no embedded arguments -
          # it exists to undo autoconf 2.70+ emitting CC="clang -std=gnu11"
          # - which is why the iOS flags live in a wrapper script rather
          # than being packed into CC.
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)

          # The C++ std lib probe (fp_find_cxx_std_lib.m4) only tries
          # c++abi/cxxrt combinations and still has no plain-c++ fallback
          # in 9.14; current macOS SDKs no longer ship a linkable
          # libc++abi, so the probe cannot succeed on this image even with
          # SDKROOT (the iOS SDK still carries libc++abi, which is why the
          # source-tree configure passes). Pre-seed the documented
          # escape-hatch variables: modern Darwin bundles the ABI inside
          # libc++, so plain c++ is the truthful answer.
          export CXX_STD_LIB_LIBS="c++"
          export CXX_STD_LIB_LIB_DIRS=""
          export CXX_STD_LIB_DYN_LIB_DIRS=""

          # --docs=none is LOAD-BEARING here, unlike in the build step.
          # 'install' needs 'binary-dist-dir', and Rules/BinaryDist.hs
          # unconditionally adds the "docs" phony to its target list - the
          # CrossCompiling flag next to it gates only iserv, not docs. The
          # default doc set is [minBound..maxBound], which includes
          # SphinxPDFs, and sphinx-build/xelatex/makeindex/makeinfo are NOT
          # in Builder.hs's isOptional list, so a stock macos-latest image
          # hard-errors with 'Non optional builder "sphinx-build" is not
          # specified'. This is new in 9.14: 9.8.4's binary-dist-dir rule
          # had no doc target, which is why the 9.8.4 artifact ships an
          # empty share/doc and no green run ever exercised this path.
          hadrian/build install --prefix=$HOME/ghc-ios \
            --flavour=quick+native_bignum --docs=none \
            "stage1.*.ghc.link.opts += -optl-isysroot -optl$IOS_SDK" \
            "stage1.rts.cabal.configure.opts += --flags=-libm --flags=-libdl" \
            "stage1.rts.ghc.link.opts += -optl-L_build/stage1/libffi/build/inst/lib" \
            || {
              echo "=== install failed; bindist config.log probe section ==="
              find _build/bindist -name config.log -exec grep -n -B 4 -A 40 "linkage against\|std_lib\|linker target\|merge objects" {} \;
              echo "=== bindist config.log tail ==="
              find _build/bindist -name config.log -exec tail -60 {} \;
              exit 1
            }

      - name: Save cross GHC cache
        # Runs whenever this run built the toolchain - including release
        # runs, which never restore. Saved here, right after Install, so
        # a later packaging failure cannot cost the hour-long build; the
        # portability patch below is applied fresh on every run.
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ghc-ios
          key: ghc-9.14.1-aarch64-apple-ios-${{ hashFiles('cross-compiler/patches/*.patch', '.github/workflows/cross-compiler.yml') }}

      - name: Patch artifact for portability
        run: |
          # The installed cross-compiler has hardcoded CI runner paths in
          # its settings file. We replace them with portable alternatives
          # so the artifact works on ANY macOS machine:
          #
          #   ios-cc   - xcrun discovers the iOS SDK at runtime
          #   settings - uses $topdir so paths are relative to the install
          #
          # Without this step, anyone who downloads the artifact gets:
          #   "No such file or directory: /Users/runner/..."
          #
          # Layout note: ghclibdir is <prefix>/lib/<target>-ghc-<version>,
          # GHC's $topdir is ghclibdir/lib (where settings lives), and the
          # wrappers sit in the SIBLING ghclibdir/bin - which settings
          # refers to as "$topdir/../bin". In 9.8 that directory was
          # $topdir/bin; hadrian no longer creates a lib/bin at all.
          GHC_ROOT=~/ghc-ios/lib/aarch64-apple-ios-ghc-9.14.1
          GHC_LIB="$GHC_ROOT/lib"
          BIN_DIR="$GHC_ROOT/bin"
          test -d "$BIN_DIR" || { echo "expected wrapper dir $BIN_DIR to exist"; exit 1; }

          # The deployment target is defined ONCE here and used in two
          # places: the wrapper below and the settings flags in step 3.
          # Both must agree - see the note in step 3 for why one position
          # is not enough.
          IOS_TRIPLE="arm64-apple-ios${IOS_MIN}"

          # 1. Create portable ios-cc wrapper (uses xcrun for dynamic SDK)
          printf '#!/bin/sh\nexec xcrun --sdk iphoneos clang -target %s "$@"\n' "$IOS_TRIPLE" > "$BIN_DIR/ios-cc"
          printf '#!/bin/sh\nexec xcrun --sdk iphoneos clang++ -target %s "$@"\n' "$IOS_TRIPLE" > "$BIN_DIR/ios-cxx"
          chmod +x "$BIN_DIR/ios-cc" "$BIN_DIR/ios-cxx"

          # 2. Patch settings to use $topdir-relative wrappers.
          #    "ld command" is NOT in this list: 9.14 removed the key, and
          #    GHC computes ld_prog from cc_prog regardless, so patching
          #    the C compiler command already redirects the linker and the
          #    assembler. The three CPP keys are new in 9.14 and the
          #    bindist configure fills them with the HOST compiler; left
          #    alone they ship a cross-compiler that preprocesses with
          #    macOS headers.
          SETTINGS="$GHC_LIB/settings"
          sed -i '' \
            -e 's|"C compiler command", "[^"]*"|"C compiler command", "$topdir/../bin/ios-cc"|' \
            -e 's|"C++ compiler command", "[^"]*"|"C++ compiler command", "$topdir/../bin/ios-cxx"|' \
            -e 's|"Haskell CPP command", "[^"]*"|"Haskell CPP command", "$topdir/../bin/ios-cc"|' \
            -e 's|"CPP command", "[^"]*"|"CPP command", "$topdir/../bin/ios-cc"|' \
            -e 's|"C-- CPP command", "[^"]*"|"C-- CPP command", "$topdir/../bin/ios-cc"|' \
            -e 's|"cross compiling", "NO"|"cross compiling", "YES"|' \
            "$SETTINGS"

          # 3. Pin the deployment target in the settings FLAGS keys.
          #    The bindist configure (which hadrian runs with nothing but
          #    --prefix, see Rules/BinaryDist.hs installTo) calls
          #    FP_CC_SUPPORTS_TARGET. That probes the host cc with
          #    --target=$LlvmTarget and, when the probe succeeds - it does
          #    on current Xcode - PREPENDS a versionless
          #    "--target=arm64-apple-ios" to the STAGE2 cc/cxx/link opts,
          #    which FP_SETTINGS then writes into these three keys.
          #    GHC passes them AFTER the wrapper's own -target and clang
          #    honours the LAST one, so the floor would silently collapse
          #    to clang's versionless default of iOS 7: no thread-local
          #    storage, and LC_VERSION_MIN_IPHONEOS in place of
          #    LC_BUILD_VERSION. Normalising every occurrence to the
          #    versioned triple makes the ordering irrelevant instead of
          #    load-bearing - both positions now say the same thing. The
          #    wrapper keeps its copy because the three CPP keys point at
          #    ios-cc and their flags carry no target of their own.
          sed -i '' -e 's|--target=arm64-apple-ios[0-9.]* *||g' "$SETTINGS"
          for key in "C compiler flags" "C++ compiler flags" "C compiler link flags"; do
            sed -i '' -e "s|\"$key\", \"|\"$key\", \"--target=$IOS_TRIPLE |" "$SETTINGS"
          done

          # 4. Verify. Each key is asserted individually: a single grep -E
          #    with alternatives exits 0 when ANY one matches, which would
          #    hide a key that disappeared in a future GHC.
          for key in "C compiler command" "Haskell CPP command" "CPP command" "C-- CPP command"; do
            grep -qF "\"$key\", \"\$topdir/../bin/ios-cc\"" "$SETTINGS" \
              || { echo "settings key not rewritten: $key"; grep "\"$key\"" "$SETTINGS"; exit 1; }
          done
          grep -qF '"C++ compiler command", "$topdir/../bin/ios-cxx"' "$SETTINGS" \
            || { echo "settings key not rewritten: C++ compiler command"; grep '"C++ compiler command"' "$SETTINGS"; exit 1; }
          grep -qF '"cross compiling", "YES"' "$SETTINGS" \
            || { echo "cross compiling flag not set"; exit 1; }
          for key in "C compiler flags" "C++ compiler flags" "C compiler link flags"; do
            grep -qF "\"$key\", \"--target=$IOS_TRIPLE " "$SETTINGS" \
              || { echo "deployment target not pinned in: $key"; grep "\"$key\"" "$SETTINGS"; exit 1; }
          done
          # Nothing may name a versionless iOS target any more - that is
          # the exact construct that silently drops the floor to iOS 7.
          if grep -E -- '--target=arm64-apple-ios([^0-9]|$)' "$SETTINGS"; then
            echo "settings still carries a versionless iOS target"; exit 1
          fi
          # The wrapper and the settings flags must name the SAME target.
          for w in ios-cc ios-cxx; do
            grep -qF -- "-target $IOS_TRIPLE " "$BIN_DIR/$w" \
              || { echo "wrapper target does not match \$IOS_TRIPLE: $w"; exit 1; }
          done
          echo "=== ios-cc ==="
          cat "$BIN_DIR/ios-cc"
          echo "=== ios-cxx ==="
          cat "$BIN_DIR/ios-cxx"

          # 5. Make the top-level bin/ wrappers relocatable.
          #    A non-relocatable bindist install writes wrapper scripts
          #    into <prefix>/bin with SIX absolute paths baked in by
          #    mk/install_script.sh (exedir, executablename, bindir,
          #    libdir, docdir, includedir), all naming the --prefix used
          #    at build time. On the runner that is /Users/runner/ghc-ios,
          #    which exists nowhere else, so every shipped release before
          #    this one failed on first use with
          #    "No such file or directory: /Users/runner/...". Verify
          #    could not catch it: Verify runs ON the runner, where that
          #    path is real.
          #    The real binaries under $topdir/../bin are unaffected -
          #    only these launcher scripts carry the prefix - so deriving
          #    it from the script's own location is the whole fix. The
          #    shebang is preserved rather than assumed.
          WRAPPER_DIR=~/ghc-ios/bin
          BUILD_PREFIX="$HOME/ghc-ios"
          for w in "$WRAPPER_DIR"/*; do
            [ -L "$w" ] && continue
            head -1 "$w" | grep -q '^#!' || continue
            grep -q "$BUILD_PREFIX" "$w" || continue
            {
              head -1 "$w"
              echo 'prefix=$(cd "$(dirname "$0")/.." && pwd)'
              tail -n +2 "$w" | sed "s|$BUILD_PREFIX|\$prefix|g"
            } > "$w.reloc" && mv "$w.reloc" "$w" && chmod +x "$w"
            echo "relocated $(basename "$w")"
          done

          # 6. NOTHING under the install root may name a build-machine
          #    path. Broader than the old settings-only check on purpose:
          #    the wrapper bug lived outside settings for three releases
          #    precisely because nothing looked there.
          LEAKED=$(grep -rl -e "$BUILD_PREFIX" -e '/tmp/ios' ~/ghc-ios 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "build-machine paths survive in the artifact:"
            echo "$LEAKED"
            exit 1
          fi

      - name: Verify
        run: |
          # Hard gate. On a cache-hit run this is the only check that the
          # cached toolchain is sane before it is repackaged and uploaded.
          ls -la ~/ghc-ios/bin/
          ~/ghc-ios/bin/aarch64-apple-ios-ghc --version | grep '9\.14\.1'

          # "Target platform" reports aarch64-apple-DARWIN on 9.14, not
          # -ios. That is correct and not a misconfiguration: configure
          # folds darwin|ios|watchos|tvos into OSDarwin, and 9.14
          # reconstructs the reported triple from that typed value
          # (targetPlatformTriple) instead of echoing the configure
          # triple as 9.8 did. The iOS-ness of the toolchain lives in
          # "LLVM target", which is asserted below, and in the C compiler
          # flags. Asserting the exact string keeps a future change here
          # loud rather than silent.
          ~/ghc-ios/bin/aarch64-apple-ios-ghc --info | grep '("Target platform","aarch64-apple-darwin")'
          ~/ghc-ios/bin/aarch64-apple-ios-ghc --info | grep -F "(\"LLVM target\",\"arm64-apple-ios${IOS_MIN}\")"

          # Smoke test: compile a static library with the exact toolchain
          # a user downloads - the xcrun-based ios-cc wrapper the
          # portability step just wrote, not the /tmp build wrapper.
          # This is the only compile the shipped wrapper gets before
          # upload. Same invocation shape as the README's Using-it
          # section, and the real proof the output targets iOS.
          SMOKE=$(mktemp -d)
          printf '{-# LANGUAGE ForeignFunctionInterface #-}\nmodule Smoke where\n\nforeign export ccall nk_smoke :: Int -> Int\n\nnk_smoke :: Int -> Int\nnk_smoke = succ\n' > "$SMOKE/Smoke.hs"
          ~/ghc-ios/bin/aarch64-apple-ios-ghc -staticlib -no-hs-main -o "$SMOKE/libsmoke.a" "$SMOKE/Smoke.hs"
          lipo -info "$SMOKE/libsmoke.a"
          lipo -info "$SMOKE/libsmoke.a" | grep arm64
          nm "$SMOKE/libsmoke.a" 2>/dev/null | grep -q '_nk_smoke'
          # The object must be built for iOS, not macOS - this is the
          # assertion the platform triple used to provide before 9.14
          # started reporting aarch64-apple-darwin. Current toolchains
          # emit LC_BUILD_VERSION with "platform 2" (iOS); "platform 1"
          # is macOS and is the exact failure this guards against.
          otool -l "$SMOKE/libsmoke.a" > "$SMOKE/loadcmds.txt"
          grep -q 'platform 2' "$SMOKE/loadcmds.txt" \
            || { echo "smoke object is not an iOS build"; head -40 "$SMOKE/loadcmds.txt"; exit 1; }
          if grep -q 'platform 1' "$SMOKE/loadcmds.txt"; then
            echo "smoke object contains a macOS-platform member"; exit 1
          fi
          # And prove the DEPLOYMENT FLOOR, not just the platform. A
          # versionless --target reaching the shipped cc flags yields
          # LC_VERSION_MIN_IPHONEOS 7.0 with no LC_BUILD_VERSION at all,
          # which is iOS but far below the iOS 15 floor the RTS needs for
          # native thread-local storage.
          grep -qF "minos ${IOS_MIN}" "$SMOKE/loadcmds.txt" \
            || { echo "smoke object does not carry the iOS ${IOS_MIN} floor"; grep -A 4 'VERSION' "$SMOKE/loadcmds.txt" | head -20; exit 1; }
          echo "smoke test OK: arm64 iOS static library with exported symbol"

          # Relocation check. Everything above runs from the same prefix
          # the toolchain was installed to, so a path baked in at build
          # time still resolves here and a broken artifact looks perfect -
          # which is exactly how v42, v43 and v44 all shipped unusable.
          # Give the wrappers a different prefix and make them find their
          # own installation from it. lib/ and share/ are symlinked rather
          # than copied: what is under test is whether the launcher
          # scripts resolve relative to themselves, and step 6 of the
          # portability patch already proves no other file names a
          # build-machine path.
          RELOC=$(mktemp -d)
          cp -R ~/ghc-ios/bin "$RELOC/bin"
          ln -s ~/ghc-ios/lib "$RELOC/lib"
          ln -s ~/ghc-ios/share "$RELOC/share"
          "$RELOC/bin/aarch64-apple-ios-ghc" --version | grep '9\.14\.1' \
            || { echo "toolchain does not run from a relocated prefix"; exit 1; }
          echo "relocation OK: the artifact runs from a prefix it was not built for"

      - name: Package
        run: tar czf ghc-9.14.1-aarch64-apple-ios.tar.gz -C ~ ghc-ios

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ghc-9.14.1-aarch64-apple-ios
          path: ghc-9.14.1-aarch64-apple-ios.tar.gz
          # Repo retention cap is 30; the durable copy of a green build is
          # its GitHub Release, not the CI artifact.
          retention-days: 30

  # Publishes THIS run's artifact as a durable Release. Opt-in via the
  # release_tag dispatch input; the only job with write access. Release
  # from a from-scratch run for clean provenance - on a cache hit the
  # tarball is repackaged from the cached toolchain, so the commit named
  # below is the packaging commit, not necessarily the building one.
  publish-release:
    name: Publish Release
    needs: build-ghc-ios
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download toolchain artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ghc-9.14.1-aarch64-apple-ios

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          TARBALL=ghc-9.14.1-aarch64-apple-ios.tar.gz
          # Must contain the compiler. grep is the pipeline's last
          # command, so its status - not tar's - decides the step on a
          # miss; no -q so the matched path lands in the log.
          tar tzf "$TARBALL" | grep 'ghc-ios/bin/aarch64-apple-ios-ghc$'
          SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          {
            echo "GHC 9.14.1 cross-compiler for aarch64-apple-ios."
            echo
            echo "Built by run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "sha256: ${SHA256}"
            echo
            echo 'Unpack to ~/ghc-ios (or point $GHC_IOS at it). Host requirements are in the README.'
          } > release-notes.md
          # gh fails if the tag already exists - published releases are
          # never clobbered.
          # --repo is required: this job has no checkout, so gh cannot
          # infer the repository from a git remote.
          gh release create "$TAG" "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG - GHC 9.14.1 for aarch64-apple-ios" \
            --notes-file release-notes.md
